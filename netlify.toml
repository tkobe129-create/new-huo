[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Nitro selects its Netlify server preset and emits the server function.
  NETLIFY = "true"

# Configure these in Netlify UI, never commit them:
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, BETTER_AUTH_URL, BETTER_AUTH_SECRET
# The Turso token is server-only and must not use a VITE_ prefix.

[functions]
  directory = ".netlify/functions-internal"

# Route SSR requests to the Nitro function. Static assets remain served from dist.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
